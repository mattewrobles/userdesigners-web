name: DEBUG DB ID
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Query Notion with Actions secrets
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: |
          echo "DB_ID length: ${#NOTION_DB_ID}"
          echo "TOKEN length: ${#NOTION_TOKEN}"
          echo "TOKEN first 8: ${NOTION_TOKEN:0:8}"
          echo "--- Querying Ready posts ---"
          curl -s -X POST "https://api.notion.com/v1/databases/${NOTION_DB_ID}/query" \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d '{"page_size":100,"filter":{"property":"Status","select":{"equals":"Ready"}}}' \
            | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    if 'results' in d:
        print('posts Ready vistos por Actions token:', len(d['results']))
        for r in d['results']:
            t = r['properties'].get('Title',{}).get('title',[{}])[0].get('plain_text','')
            print('  -', t[:60])
    elif 'message' in d:
        print('ERROR:', d.get('message','')[:150])
except Exception as e:
    print('parse error:', e)
"
