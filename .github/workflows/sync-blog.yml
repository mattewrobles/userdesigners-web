name: Sync Blog from Notion

on:
  workflow_dispatch:
  schedule:
    - cron: "30 14 * * 1"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync blog posts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: node scripts/sync-notion-to-blog.js
      - name: Commit and push
        run: |
          git config user.name "blog-bot"
          git config user.email "bot@userdesigners.com"
          git add -A src/content/blog/ public/assets/blog/
          if git diff --staged --quiet && git diff --quiet; then
            echo "No changes"
          else
            git commit -m "Sync blog from Notion"
            git push
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          fi
      - name: Notify Slack
        if: env.HAS_CHANGES == 'true'
        run: |
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"channel":"C0BN01LMC3F","text":"📝 Blog UserDesigners: nuevos posts sincronizados desde Notion → https://www.userdesigners.com/blog"}'