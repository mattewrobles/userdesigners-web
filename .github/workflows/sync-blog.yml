name: Sync Blog from Notion

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to push to (main = production, preview = staging)"
        required: false
        default: "main"
      slack_channel:
        description: "Slack channel ID to notify"
        required: false
        default: "C0BN01LMC3F"
  schedule:
    - cron: "30 14 * * 1"

permissions:
  contents: write

concurrency:
  group: sync-blog-${{ github.event.inputs.target_branch || 'main' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'main' }}
      SLACK_CHANNEL: ${{ github.event.inputs.slack_channel || 'C0BN01LMC3F' }}
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_USER_DESIGNERS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4
      - name: Sync blog posts (desde Doppler)
        run: |
          export NOTION_TOKEN=$(doppler secrets get NOTION_TOKEN --plain --project user-designers --config prd)
          export NOTION_DB_ID=$(doppler secrets get NOTION_DB_ID --plain --project user-designers --config prd)
          node scripts/sync-notion-to-blog.js
      - name: Optimize blog images (WebP/JPEG 75%, max 1280px)
        run: |
          npm install --no-save sharp >/dev/null 2>&1
          node scripts/optimize-blog-images.mjs
      - name: Build image registry (ids + hashes usados)
        run: node scripts/build-image-registry.mjs
      - name: Add internal links (related posts)
        run: node scripts/add-internal-links.mjs
      - name: Regenerate llms.txt (GEO/AEO — crawlers de LLM)
        if: env.TARGET_BRANCH == 'main'
        run: node scripts/generate-llms-txt.mjs
      - name: Validate SEO (reglas críticas)
        run: |
          export NOTION_TOKEN=$(doppler secrets get NOTION_TOKEN --plain --project user-designers --config prd)
          node scripts/validate-blog-seo.mjs
        if: env.TARGET_BRANCH == 'main'
      - name: Commit and push
        run: |
          git config user.name "blog-bot"
          git config user.email "bot@userdesigners.com"
          git add -A src/content/blog/ public/assets/blog/ public/llms.txt
          # POST_COUNT = posts NUEVOS realmente publicados (los que pasaron el gate),
          # no archivos tocados en total (internal-links backfill toca posts viejos).
          # En preview no corre Validate SEO (es main-only), así que ahí se usa
          # new-posts.txt (lo recién sincronizado, sin gate) en vez de published-posts.txt.
          if [ -f /tmp/published-posts.txt ]; then
            POST_COUNT=$(grep -c . /tmp/published-posts.txt || echo 0)
          elif [ -f /tmp/new-posts.txt ]; then
            POST_COUNT=$(grep -c . /tmp/new-posts.txt || echo 0)
          else
            POST_COUNT=0
          fi
          if git diff --staged --quiet && git diff --quiet; then
            echo "No changes"
            echo "POST_COUNT=0" >> $GITHUB_ENV
          else
            git commit -m "Sync blog from Notion → $TARGET_BRANCH"
            git push origin $TARGET_BRANCH
            echo "POST_COUNT=$POST_COUNT" >> $GITHUB_ENV
          fi
      - name: Ping search engines (indexación automática)
        if: env.POST_COUNT != '0' && env.TARGET_BRANCH == 'main'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          echo "Notificando a los buscadores..."
          # Google: ping al sitemap (cubre TODAS las URLs: blogs, páginas, proyectos)
          curl -s -o /dev/null -w "Google ping: %{http_code}\n" \
            "https://www.google.com/ping?sitemap=https://www.userdesigners.com/sitemap-index.xml"
          # IndexNow: extraer TODAS las URLs del sitemap y notificarlas (Bing, Yandex, etc.)
          if [ -n "$INDEXNOW_KEY" ]; then
            # esperar a que el deploy sirva el sitemap actualizado
            sleep 20
            URLS=$(curl -s "https://www.userdesigners.com/sitemap-0.xml" \
              | grep -oE '<loc>[^<]+' | sed 's/<loc>//' | head -100 | python3 -c "import sys,json; print(json.dumps([u.strip() for u in sys.stdin if u.strip()]))")
            echo "URLs a notificar: $URLS"
            curl -s -o /dev/null -w "IndexNow ping: %{http_code}\n" \
              -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json" \
              -d "{\"host\":\"www.userdesigners.com\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"https://www.userdesigners.com/indexnow.txt\",\"urlList\":$URLS}"
          else
            echo "INDEXNOW_KEY no configurada, omitiendo IndexNow"
          fi
      - name: Post to LinkedIn (si hay posts nuevos y credenciales configuradas)
        if: env.POST_COUNT != '0' && env.TARGET_BRANCH == 'main'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}
        run: |
          if [ -z "$LINKEDIN_ACCESS_TOKEN" ] || [ -z "$LINKEDIN_ORG_URN" ]; then
            echo "LinkedIn no configurado (ver docs/LINKEDIN-DISTRIBUTION.md) — omitiendo"
          else
            export TOKENROUTER_API_KEY=$(doppler secrets get TOKENROUTER_API_KEY --plain --project user-designers --config prd)
            export CANVA_CLIENT_ID=$(doppler secrets get CANVA_CLIENT_ID --plain --project user-designers --config prd)
            export CANVA_CLIENT_SECRET=$(doppler secrets get CANVA_CLIENT_SECRET --plain --project user-designers --config prd)
            export CANVA_REFRESH_TOKEN=$(doppler secrets get CANVA_REFRESH_TOKEN --plain --project user-designers --config prd)
            export CANVA_BRAND_TEMPLATE_ID=$(doppler secrets get CANVA_BRAND_TEMPLATE_ID --plain --project user-designers --config prd)
            node scripts/post-to-linkedin.mjs
          fi
      - name: Notify Slack
        if: always()
        run: |
          SKIPPED=""
          SKIPPED_COUNT=0
          if [ -f /tmp/skipped-posts.txt ] && [ -s /tmp/skipped-posts.txt ]; then
            SKIPPED_COUNT=$(grep -c . /tmp/skipped-posts.txt || echo 0)
            SKIPPED="\n❌ *${SKIPPED_COUNT} excluido(s) por no pasar SEO/anti-slop crítico:*\n$(cat /tmp/skipped-posts.txt | sed 's/^/  • /' | sed 's/$/\\n/' | tr -d '\n')"
          fi
          POST_COUNT="${POST_COUNT:-0}"
          if [ "$TARGET_BRANCH" = "main" ]; then
            URL="https://www.userdesigners.com/blog"
            if [ "$POST_COUNT" = "0" ]; then
              if [ "$SKIPPED_COUNT" != "0" ]; then
                MSG="❌ *Blog UserDesigners:* 0 posts nuevos publicados — todo lo que llegó fue excluido.$SKIPPED"
              else
                MSG="📝 *Blog UserDesigners:* no hay posts en estado *Ready* para publicar."
              fi
            else
              MSG="✅ *Blog UserDesigners:* ${POST_COUNT} post(s) NUEVO(S) publicados en producción → $URL$SKIPPED"
            fi
          else
            URL="https://preview.userdesigners-web.pages.dev/blog"
            if [ "$POST_COUNT" = "0" ]; then
              if [ "$SKIPPED_COUNT" != "0" ]; then
                MSG="❌ *Blog Preview:* 0 posts nuevos — todo lo que llegó fue excluido.$SKIPPED"
              else
                MSG="📝 *Blog Preview:* no hay posts en estado *Ready* para publicar."
              fi
            else
              MSG="👀 *Blog Preview:* ${POST_COUNT} post(s) NUEVO(S) en preview para revisión → $URL\nAproba con: merge \`preview\` → \`main\`$SKIPPED"
            fi
          fi
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"channel\":\"$SLACK_CHANNEL\",\"text\":\"$MSG\"}"
