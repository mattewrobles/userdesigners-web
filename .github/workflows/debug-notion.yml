name: Debug Notion Bot
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Identify Notion bot
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          echo "TOKEN length: ${#NOTION_TOKEN}"
          echo "TOKEN prefix: ${NOTION_TOKEN:0:9}"
          echo "--- users/me ---"
          curl -s "https://api.notion.com/v1/users/me" \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H "Notion-Version: 2022-06-28"
          echo ""
          echo "--- Ready count ---"
          curl -s -X POST "https://api.notion.com/v1/databases/${{ secrets.NOTION_DB_ID }}/query" \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d '{"page_size":5,"filter":{"property":"Status","select":{"equals":"Ready"}}}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('results:', len(d.get('results',[])))"
