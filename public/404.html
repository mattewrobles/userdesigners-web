<!DOCTYPE html>
<html lang="es-EC">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Página no encontrada | UserDesigners</title>
  <meta name="description" content="La página que buscas no existe o fue movida. Vuelve al inicio, mira nuestro portafolio o contáctanos."/>
  <meta name="robots" content="noindex"/>
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@300;400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--surface-1);
      color: var(--text-primary);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-6);
      overflow: hidden;
      position: relative;
    }
    .wrapper {
      text-align: center;
      max-width: 480px;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    .code {
      font-family: var(--font-display);
      font-size: clamp(80px, 18vw, 140px);
      font-weight: var(--weight-light);
      line-height: var(--leading-none);
      letter-spacing: var(--tracking-tight);
      display: flex;
      justify-content: center;
      gap: 0.08em;
      perspective: 600px;
    }
    /* cada dígito es una letra que cae con gravedad */
    .code span {
      display: inline-block;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0;
      will-change: transform, opacity;
    }
    h1 {
      font-family: var(--font-display);
      font-size: var(--heading-3);
      font-weight: var(--weight-regular);
      letter-spacing: var(--tracking-snug);
      margin: var(--space-6) 0 var(--space-3);
      opacity: 0;
      transform: translateY(12px);
    }
    p {
      color: var(--text-secondary);
      font-size: var(--body);
      line-height: var(--leading-relaxed);
      margin-bottom: var(--space-7);
      opacity: 0;
      transform: translateY(12px);
    }
    .actions {
      display: flex;
      gap: var(--space-3);
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      transform: translateY(12px);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-3) var(--space-6);
      border-radius: var(--radius-btn);
      font-size: var(--body-sm);
      font-weight: var(--weight-regular);
      text-decoration: none;
      border: 2px solid transparent;
      transition: background var(--duration-fast) ease, border-color var(--duration-fast) ease, color var(--duration-fast) ease;
    }
    .btn--primary {
      background: var(--surface-glass);
      border-color: var(--border-strong);
      color: var(--text-primary);
    }
    .btn--primary:hover { background: var(--surface-glass-hover); }
    .btn--ghost {
      background: transparent;
      border-color: var(--border-subtle);
      color: var(--text-secondary);
    }
    .btn--ghost:hover { color: var(--text-primary); border-color: var(--border-strong); }
    .btn:focus-visible {
      outline: 2px solid var(--accent-default);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="wrapper">
    <div class="code" id="code404" aria-label="404">
      <span>4</span><span>0</span><span>4</span>
    </div>
    <h1 id="title404">Página no encontrada</h1>
    <p id="desc404">La página que buscas no existe o fue movida. Mientras tanto, mira nuestro trabajo o cuéntanos tu proyecto.</p>
    <div class="actions" id="actions404">
      <a class="btn btn--primary" href="/" role="button">Volver al inicio</a>
      <a class="btn btn--ghost" href="/proyectos" role="button">Ver proyectos</a>
      <a class="btn btn--ghost" href="/contacto" role="button">Contáctanos</a>
    </div>
  </main>

  <script type="module">
    import { animate, spring } from "https://esm.sh/motion@13";

    const digits = document.querySelectorAll("#code404 span");
    const title = document.getElementById("title404");
    const desc = document.getElementById("desc404");
    const actions = document.getElementById("actions404");

    // respeta prefers-reduced-motion: muestra todo sin animar
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!reduced) {
      // las letras caen desde arriba con gravedad (spring de rebote)
      digits.forEach((d, i) => {
        const delay = i * 0.18;
        animate(d, { y: [-220, 0] }, {
          type: spring,
          stiffness: 320,
          damping: 18,
          mass: 1.2,
          delay,
        });
        animate(d, { opacity: [0, 1] }, { duration: 0.3, delay });
      });

      // título, descripción y botones entran después con fade + subida
      const rest = [
        { el: title, delay: 0.7 },
        { el: desc, delay: 0.9 },
        { el: actions, delay: 1.1 },
      ];
      rest.forEach(({ el, delay }) => {
        if (!el) return;
        animate(el, { opacity: 1, y: 0 }, { duration: 0.5, delay });
      });
    } else {
      digits.forEach(d => (d.style.opacity = "1"));
      title.style.opacity = "1";
      desc.style.opacity = "1";
      actions.style.opacity = "1";
    }
  </script>
</body>
</html>
