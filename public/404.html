<!DOCTYPE html>
<html lang="es-EC">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Página no encontrada | UserDesigners</title>
  <meta name="description" content="La página que buscas no existe o fue movida. Vuelve al inicio, mira nuestro portafolio o contáctanos."/>
  <meta name="robots" content="noindex"/>
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@300;400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--surface-1);
      color: var(--text-primary);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-6);
      overflow: hidden;
      position: relative;
    }
    .wrapper {
      text-align: center;
      max-width: 480px;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    .code {
      font-family: var(--font-display);
      font-size: clamp(80px, 18vw, 140px);
      font-weight: var(--weight-light);
      line-height: var(--leading-none);
      letter-spacing: var(--tracking-tight);
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 {
      font-family: var(--font-display);
      font-size: var(--heading-3);
      font-weight: var(--weight-regular);
      letter-spacing: var(--tracking-snug);
      margin: var(--space-6) 0 var(--space-3);
    }
    p {
      color: var(--text-secondary);
      font-size: var(--body);
      line-height: var(--leading-relaxed);
      margin-bottom: var(--space-7);
    }
    .actions {
      display: flex;
      gap: var(--space-3);
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-3) var(--space-6);
      border-radius: var(--radius-btn);
      font-size: var(--body-sm);
      font-weight: var(--weight-regular);
      text-decoration: none;
      border: 2px solid transparent;
      transition: background var(--duration-fast) ease, border-color var(--duration-fast) ease, color var(--duration-fast) ease, transform var(--duration-fast) ease;
    }
    .btn--primary {
      background: var(--surface-glass);
      border-color: var(--border-strong);
      color: var(--text-primary);
    }
    .btn--primary:hover { background: var(--surface-glass-hover); }
    .btn--ghost {
      background: transparent;
      border-color: var(--border-subtle);
      color: var(--text-secondary);
    }
    .btn--ghost:hover { color: var(--text-primary); border-color: var(--border-strong); }
    .btn:focus-visible {
      outline: 2px solid var(--accent-default);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="wrapper">
    <div class="code">404</div>
    <h1>Página no encontrada</h1>
    <p>La página que buscas no existe o fue movida. Mientras tanto, mira nuestro trabajo o cuéntanos tu proyecto.</p>
    <div class="actions">
      <a class="btn btn--primary" href="/" role="button">Volver al inicio</a>
      <a class="btn btn--ghost" href="/proyectos" role="button">Ver proyectos</a>
      <a class="btn btn--ghost" href="/contacto" role="button">Contáctanos</a>
    </div>
  </main>
</body>
</html>
