<!DOCTYPE html>
<html lang="es-EC">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Página no encontrada | UserDesigners</title>
  <meta name="description" content="La página que buscas no existe o fue movida. Vuelve al inicio, mira nuestro portafolio o contáctanos."/>
  <meta name="robots" content="noindex"/>
  <style>
    :root {
      --ud-black: #030303;
      --ud-white: #ffffff;
      --ud-gray: rgb(161, 161, 168);
      --ud-blue: #0099ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--ud-black);
      color: var(--ud-white);
      font-family: "DM Sans", "Inter", -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .wrapper {
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .code {
      font-size: clamp(80px, 18vw, 140px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #fff 0%, rgb(161,161,168) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin: 24px 0 12px;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--ud-gray);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .btn--primary {
      background: var(--ud-blue);
      color: #fff;
    }
    .btn--ghost {
      border: 1px solid rgb(61, 61, 61);
      color: var(--ud-white);
    }
    .btn:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="wrapper">
    <div class="code">404</div>
    <h1>Página no encontrada</h1>
    <p>La página que buscas no existe o fue movida. Mientras tanto, mira nuestro trabajo o cuéntanos tu proyecto.</p>
    <div class="actions">
      <a class="btn btn--primary" href="/" role="button">Volver al inicio</a>
      <a class="btn btn--ghost" href="/proyectos" role="button">Ver proyectos</a>
      <a class="btn btn--ghost" href="/contacto" role="button">Contáctanos</a>
    </div>
  </main>
</body>
</html>
